name: Build & Deploy to Hostinger VPS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-test:
    name: Build and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Backend Dependencies
        run: dotnet restore

      - name: Build Backend (.NET)
        run: dotnet build --no-restore -c Release

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Empresa.Web/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: Empresa.Web
        run: npm ci

      - name: Lint Frontend
        working-directory: Empresa.Web
        run: npm run lint

      - name: Build Frontend (React / Vite)
        working-directory: Empresa.Web
        run: npm run build

  publish-images:
    name: Build & Push Docker Images
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase Repository Name
        id: repo_name
        run: echo "REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      # Backend API Image
      - name: Build & Push Backend API Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/api:latest
            ghcr.io/${{ env.REPO }}/api:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Frontend Web Image
      - name: Build & Push Frontend Web Image
        uses: docker/build-push-action@v5
        with:
          context: ./Empresa.Web
          file: ./Empresa.Web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO }}/web:latest
            ghcr.io/${{ env.REPO }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-vps:
    name: Deploy to Hostinger VPS
    needs: publish-images
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOSTINGER_SSH_IP }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/gestaonew

            echo "Autenticando no GitHub Container Registry..."
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

            echo "Baixando novas imagens..."
            export API_IMAGE="ghcr.io/${{ github.repository_owner }}/gestaonew/api:latest"
            export WEB_IMAGE="ghcr.io/${{ github.repository_owner }}/gestaonew/web:latest"
            docker compose -f docker-compose.prod.yml pull api web

            echo "Recriando containers..."
            docker compose -f docker-compose.prod.yml up -d --remove-orphans api web

            echo "Limpando imagens antigas..."
            docker image prune -f

            echo "Deploy concluído com sucesso!"
