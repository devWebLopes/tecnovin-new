# ─────────────────────────────────────────────
# docker-compose.yml — GestaoNew API
# Uso: docker-compose up -d
# A connection string Oracle deve ser configurada via variável de ambiente
# ─────────────────────────────────────────────

services:
  empresa-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gestaonew-api
    ports:
      - "5000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Oracle=${ORACLE_CONNECTION_STRING}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=Empresa.Api
      - Jwt__Audience=Empresa.App
      - TZ=America/Sao_Paulo
    volumes:
      - logs:/app/logs
    restart: unless-stopped
    networks:
      - gestaonew-network

networks:
  gestaonew-network:
    driver: bridge

volumes:
  logs: